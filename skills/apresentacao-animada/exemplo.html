<!doctype html>
<!-- Minimal 9:16 page for render.mjs: renderAt(t), TOTAL, pronto, TEXTS built from the same data the scenes use.
     node render.mjs --html exemplo.html --leitura   |   node render.mjs --html exemplo.html --saida exemplo.mp4 -->
<html lang="pt-BR"><head><meta charset="utf-8"><title>exemplo</title>
<style>
:root{--bg:#0b0d12;--ink:#f5f7fa;--accent:#4f8cff}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.el{position:absolute;left:54px;right:54px;opacity:0}
.title{top:300px;font:700 150px/1.05 Georgia,serif}
.sub{bottom:330px;font-size:44px;line-height:1.5}
.sub span{background:var(--ink);color:var(--bg);padding:6px 14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.big{top:760px;text-align:center;font:800 260px/1 system-ui,sans-serif;color:var(--accent)}
</style></head><body>
<div class="el title" data-kind="title" data-from="0" data-to="4.4">Leia antes de cortar</div>
<div class="el sub" data-kind="subtitle" data-from="0.3" data-to="4.4"><span>Cada texto fica o tempo de ser lido</span></div>
<div class="el big" data-kind="text" data-from="4" data-to="6">Pronto</div>
<script>
window.TOTAL = 6;
const els = [...document.querySelectorAll("[data-kind]")];
window.TEXTS = els.map(e => ({ text: e.textContent.trim(), kind: e.dataset.kind, from: +e.dataset.from, to: +e.dataset.to }));
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3); // out-cubic, 0..1
window.renderAt = t => els.forEach((e, i) => {
  const { from, to } = TEXTS[i], fadeIn = ease((t - from) / 0.4);
  const k = to >= TOTAL ? fadeIn : Math.min(fadeIn, 1 - ease((t - to + 0.4) / 0.4)); // the last text holds the final frame
  e.style.opacity = Math.max(0, k);
  e.style.transform = `translateY(${(1 - fadeIn) * 40}px)`;
});
if (!location.search.includes("render")) { // preview: plays alone, Space pauses, arrows jump 1 s
  let at = 0, last = performance.now(), play = true;
  addEventListener("keydown", e => { if (e.key === " ") play = !play; if (e.key === "ArrowRight") at = Math.min(TOTAL, at + 1); if (e.key === "ArrowLeft") at = Math.max(0, at - 1); });
  requestAnimationFrame(function loop(now) { if (play) at = (at + (now - last) / 1000) % TOTAL; last = now; renderAt(at); requestAnimationFrame(loop); });
}
document.fonts.ready.then(() => { renderAt(0); window.pronto = true; });
</script>
</body></html>
